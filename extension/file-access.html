<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>$i18n{fileAccessTitle}</title>
    <link rel="icon" href="icons/app-32.png" />
    <style>
      body {
        font: 16px/1.7 system-ui;
        max-width: 640px;
        margin: 12vh auto;
        padding: 24px;
        color: #292929;
      }
      h1 {
        font-size: 28px;
        line-height: 1.3;
      }
      li {
        margin: 14px 0;
      }
      p {
        color: #777;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        background: #5746b7;
        color: #fff;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #5746b7;
        outline-offset: 2px;
      }
      #status {
        color: #1e7b34;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1f1f1f;
          color: #e8e8e8;
        }
        p {
          color: #a8a8a8;
        }
        #status {
          color: #7fd08f;
        }
      }
    </style>
  </head>
  <body style="visibility: hidden">
    <h1>$i18n{fileAccessTitle}</h1>
    <p>$i18n{fileAccessIntro}</p>
    <ol>
      <li>$i18n{fileAccessStepOne}</li>
      <li>$i18n{fileAccessStepTwo}</li>
      <li>$i18n{fileAccessStepThree}</li>
    </ol>
    <p><button id="open" type="button">$i18n{fileAccessOpen}</button></p>
    <p id="status" role="status" hidden>$i18n{fileAccessOn}</p>
    <p>$i18n{fileAccessScope}</p>
    <script type="module" src="file-access.js"></script>
  </body>
</html>
