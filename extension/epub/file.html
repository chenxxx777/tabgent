<!doctype html>
<!-- The entry page for EPUB books opened from the computer (file://): it copies the book
     into the reading vault and opens it in the reader. Web accessible only to file://
     pages: see epub-routing.js. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>$i18n{epubPageTitle}</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='%23858585' stroke-width='1.8' stroke-linejoin='round' d='M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zm0 15A2.5 2.5 0 0 0 6.5 23H20v-5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light dark;
        font:
          15px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      body {
        max-width: 560px;
        margin: 18vh auto;
        padding: 0 24px;
        color: #252525;
      }
      h1 {
        font-size: 22px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      #status {
        color: #858585;
      }
      #problem p {
        margin: 0 0 16px;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        margin-right: 8px;
        border: 1px solid #d6d6d6;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: #242424;
        background: #242424;
        color: #fff;
      }
      button:focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1f1f1f;
          color: #e8e8e8;
        }
        button {
          border-color: #4a4a4a;
        }
        button.primary {
          border-color: #e8e8e8;
          background: #e8e8e8;
          color: #1f1f1f;
        }
      }
    </style>
  </head>
  <body style="visibility: hidden">
    <h1 id="name">$i18n{epubPageTitle}</h1>
    <p id="status" role="status">$i18n{epubLoading}</p>
    <div id="problem" role="alert" hidden>
      <p id="message"></p>
      <p>
        <button id="settings" class="primary" type="button" hidden>$i18n{fileAccessOpen}</button
        ><button id="library" type="button">$i18n{epubLibrary}</button>
      </p>
    </div>
    <script type="module" src="file.js"></script>
  </body>
</html>
